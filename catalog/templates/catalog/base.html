<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Каталог{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'product_list' %}">👶 KidsShop</a>
            
            <div class="d-flex ms-auto align-items-center">
                <form class="d-flex me-3" action="{% url 'product_list' %}" method="get">
                    <input class="form-control me-2" type="search" name="q" placeholder="Искать одежду..." value="{{ query|default:'' }}">
                    <button class="btn btn-light" type="submit">Найти</button>
                </form>
    
                <a href="{% url 'cart_detail' %}" class="btn btn-warning position-relative">
                    🛒 Корзина
                    {% if cart|length > 0 %}
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            {{ cart|length }}
                        </span>
                    {% endif %}
                </a>
            </div>
        </div>
    </nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
