{% extends "catalog/base.html" %}

{% block title %}Заказ оформлен{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="text-success mb-4">Спасибо за заказ!</h1>
    <p class="lead">Ваш заказ <strong>№{{ order.id }}</strong> успешно оформлен.</p>
    <p>Мы свяжемся с вами в ближайшее время по номеру <strong>{{ order.phone }}</strong> для подтверждения доставки.</p>
    <a href="{% url 'product_list' %}" class="btn btn-primary mt-4">Вернуться в каталог</a>
</div>
{% endblock %}
